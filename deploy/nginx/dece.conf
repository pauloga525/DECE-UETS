# Sistema DECE en la red local — https://dece.192-168-200-31.nip.io
#
# Instalación (en el servidor 192.168.200.31):
#   sudo cp deploy/nginx/dece.conf /etc/nginx/sites-available/dece.conf
#   sudo ln -s /etc/nginx/sites-available/dece.conf /etc/nginx/sites-enabled/dece.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificados: deploy/certs/generar-certificados.sh (CA interna; ver docs/guia-despliegue.md 3.5).
# Solo se publica el portal: él mismo reenvía /tutorias/** al micro frontend y /api/** al
# gateway (mismo origen). Si cambiaste PORTAL_PORT en .env, ajusta el proxy_pass.

# Entrada por HTTP: página de bienvenida (deploy/bienvenida/index.html). Comprueba si el equipo
# ya confía en el certificado: si confía, entra directo al sistema por HTTPS; si no, muestra un
# modal con los pasos para instalarlo (instalador de doble clic en Windows). Comparte con los
# usuarios ESTA dirección: http://dece.192-168-200-31.nip.io  (o http://192.168.200.31)
# Los archivos los publica deploy/certs/generar-certificados.sh en /var/www/dece-bienvenida.
server {
    listen 80;
    server_name dece.192-168-200-31.nip.io 192.168.200.31;
    root /var/www/dece-bienvenida;

    location = /ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="DECE-UETS-CA.crt"';
    }
    location = /instalar-certificado-dece.cmd {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="instalar-certificado-dece.cmd"';
    }
    location / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
}

server {
    # Sintaxis compatible con Nginx 1.24 (Ubuntu 24.04). En Nginx >= 1.25.1 da solo un aviso.
    listen 443 ssl http2;
    server_name dece.192-168-200-31.nip.io;

    ssl_certificate     /etc/nginx/certs/dece/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/dece/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dece_ssl:10m;

    # Archivos subidos (Excel de reportes/importaciones).
    client_max_body_size 10m;

    location = /ca.crt {
        alias /etc/nginx/certs/dece/DECE-UETS-CA.crt;
        default_type application/x-x509-ca-cert;
    }

    # La página de bienvenida (http) pide esto para saber si el equipo ya confía en el certificado.
    location = /cert-ok {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (por si alguna pantalla lo usa).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Necesario para la cabecera Connection de arriba. Si otro sitio del servidor ya define
# $connection_upgrade (error "duplicate variable"), borra este bloque.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
